services:
  db:
    image: postgres:16-alpine
    container_name: monai-db
    environment:
      POSTGRES_USER: monai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - add it to .env}
      POSTGRES_DB: monai
    # Keep the db on the default bridge: host networking would make pg_hba trust loopback and void the password.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - monai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: monai-backend
    # Host networking: reaches the host's Ollama daemon (127.0.0.1:11434) and the
    # db's published port (127.0.0.1:5434) directly. Avoids forcing Ollama to
    # rebind to 0.0.0.0. Linux-only; on Mac/Windows switch to bridge + host.docker.internal.
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://monai:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - add it to .env}@127.0.0.1:5434/monai
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: gemma4:31b-cloud
      OLLAMA_EMBED_MODEL: gemma4:31b-cloud
      # TZ drives Python's date.today(); PGTZ sets the Postgres session TimeZone that CURRENT_DATE uses.
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
      MONAI_API_KEY: ${MONAI_API_KEY:?MONAI_API_KEY must be set - add it to .env}
      # Optional second secret that approves or rejects any proposal. Must differ from
      # MONAI_API_KEY; never put it in any MCP client config. Empty means the approver
      # routes answer 503 (fail-closed). The frontend also receives it, for the
      # allowlisted proxy injection used by the Inbox.
      MONAI_APPROVER_KEY: ${MONAI_APPROVER_KEY:-}
      MONAI_SKILLS_DIR: /app/skills
    volumes:
      # The owner's SKILL.md packs, read-only (Phase 40). Gitignored; the folder is kept via skills/.gitkeep.
      - ./skills:/app/skills:ro
      # npm and uv caches plus work dirs for stdio MCP servers (Phase 41); a cold npx/uvx start is slow.
      - monai_ext:/var/lib/monai-ext
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: monai-frontend
    network_mode: host
    environment:
      # Next.js route handler at ui/app/api/[...proxy]/route.ts proxies /api/* to
      # the backend and injects MONAI_API_KEY server-side (key never in the JS bundle).
      MONAI_API: http://127.0.0.1:8001
      MONAI_API_KEY: ${MONAI_API_KEY:?MONAI_API_KEY must be set - add it to .env}
      # Optional. Read server-side only by the Next proxy, which attaches it to the
      # Inbox list, approve, reject and row-skip requests and nothing else; it is never
      # exposed to the browser. Empty means Inbox actions answer with the approver-key message.
      MONAI_APPROVER_KEY: ${MONAI_APPROVER_KEY:-}
      # Read only by ui/middleware.ts for HTTP Basic sign-in (user monai). Must differ from
      # both keys, or the UI answers 503. Never give it the client-inlined public prefix.
      MONAI_UI_PASSWORD: ${MONAI_UI_PASSWORD:?MONAI_UI_PASSWORD must be set - add it to .env}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  monai_pgdata:
  monai_ext:
